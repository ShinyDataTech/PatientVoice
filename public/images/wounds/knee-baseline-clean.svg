<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="skinBase" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5d0b5"/>
      <stop offset="70%" stop-color="#eec2a4"/>
      <stop offset="100%" stop-color="#e0b192"/>
    </radialGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Skin Layer (Right Knee Contour) -->
  <rect width="600" height="600" fill="url(#skinBase)"/>
  
  <!-- Patella & Knee Joint Anatomical Contour -->
  <path d="M 200,80 C 140,200 130,400 210,520 C 390,520 470,400 460,200 C 450,80 390,80 300,75 Z" fill="#edd0b7" opacity="0.4"/>
  <ellipse cx="300" cy="270" rx="90" ry="110" fill="#e8ba99" opacity="0.3"/>

  <!-- Mild Baseline Periwound Erythema (Normal <4mm halo) -->
  <path d="M 288,140 Q 295,300 290,460" stroke="#e07a7a" stroke-width="20" stroke-linecap="round" opacity="0.35" filter="url(#subtleGlow)"/>

  <!-- Clean Primary Surgical Incision Line -->
  <path d="M 292,145 Q 298,300 293,455" stroke="#7a2424" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Intact Surgical Staples (14 evenly spaced) -->
  <g stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round">
    <line x1="278" y1="160" x2="308" y2="160" />
    <line x1="279" y1="182" x2="309" y2="182" />
    <line x1="280" y1="205" x2="310" y2="205" />
    <line x1="281" y1="228" x2="311" y2="228" />
    <line x1="282" y1="250" x2="312" y2="250" />
    <line x1="283" y1="272" x2="313" y2="272" />
    <line x1="284" y1="295" x2="314" y2="295" />
    <line x1="283" y1="318" x2="313" y2="318" />
    <line x1="282" y1="340" x2="312" y2="340" />
    <line x1="281" y1="362" x2="311" y2="362" />
    <line x1="280" y1="385" x2="310" y2="385" />
    <line x1="279" y1="408" x2="309" y2="408" />
    <line x1="278" y1="430" x2="308" y2="430" />
    <line x1="278" y1="448" x2="308" y2="448" />
  </g>

  <!-- Staple Metallic Punctures -->
  <g fill="#475569">
    <circle cx="278" cy="160" r="1.5"/><circle cx="308" cy="160" r="1.5"/>
    <circle cx="279" cy="182" r="1.5"/><circle cx="309" cy="182" r="1.5"/>
    <circle cx="280" cy="205" r="1.5"/><circle cx="310" cy="205" r="1.5"/>
    <circle cx="281" cy="228" r="1.5"/><circle cx="311" cy="228" r="1.5"/>
    <circle cx="282" cy="250" r="1.5"/><circle cx="312" cy="250" r="1.5"/>
    <circle cx="283" cy="272" r="1.5"/><circle cx="313" cy="272" r="1.5"/>
    <circle cx="284" cy="295" r="1.5"/><circle cx="314" cy="295" r="1.5"/>
    <circle cx="283" cy="318" r="1.5"/><circle cx="313" cy="318" r="1.5"/>
    <circle cx="282" cy="340" r="1.5"/><circle cx="312" cy="340" r="1.5"/>
    <circle cx="281" cy="362" r="1.5"/><circle cx="311" cy="362" r="1.5"/>
    <circle cx="280" cy="385" r="1.5"/><circle cx="310" cy="385" r="1.5"/>
    <circle cx="279" cy="408" r="1.5"/><circle cx="309" cy="408" r="1.5"/>
    <circle cx="278" cy="430" r="1.5"/><circle cx="308" cy="430" r="1.5"/>
    <circle cx="278" cy="448" r="1.5"/><circle cx="308" cy="448" r="1.5"/>
  </g>

  <!-- Clean Badge Marker -->
  <g transform="translate(30, 30)">
    <rect width="180" height="34" rx="6" fill="#065f46" opacity="0.9"/>
    <text x="12" y="22" fill="#ecfdf5" font-family="Arial, sans-serif" font-size="12" font-weight="bold">BASELINE: DAY 0 INTACT</text>
  </g>
</svg>
