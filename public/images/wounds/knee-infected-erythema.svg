<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="kneeSkinInf" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5d0b5"/>
      <stop offset="70%" stop-color="#eec2a4"/>
      <stop offset="100%" stop-color="#e0b192"/>
    </radialGradient>
    <radialGradient id="kneeInfHalo" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ef4444" stop-opacity="0.5"/>
      <stop offset="85%" stop-color="#f87171" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.0"/>
    </radialGradient>
    <filter id="kneeHeatmapBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#kneeSkinInf)"/>
  
  <!-- Patella & Joint Contour -->
  <ellipse cx="300" cy="270" rx="90" ry="110" fill="#e8ba99" opacity="0.3"/>

  <!-- Spreading Erythema Heatmap (28mm Halo) -->
  <path d="M 288,130 Q 300,300 290,470" stroke="url(#kneeInfHalo)" stroke-width="130" stroke-linecap="round" filter="url(#kneeHeatmapBlur)"/>

  <!-- Erythema Boundary Scanner Dashed Loop -->
  <path d="M 220,130 Q 380,300 220,470" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6,4" fill="none" opacity="0.75"/>

  <!-- Incision Line -->
  <path d="M 292,145 Q 298,300 293,455" stroke="#881337" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Surgical Staples (Distal staples stressed) -->
  <g stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round">
    <line x1="278" y1="160" x2="308" y2="160" />
    <line x1="279" y1="182" x2="309" y2="182" />
    <line x1="280" y1="205" x2="310" y2="205" />
    <line x1="281" y1="228" x2="311" y2="228" />
    <line x1="282" y1="250" x2="312" y2="250" />
    <!-- Distal erythema gap -->
    <line x1="275" y1="340" x2="315" y2="338" stroke="#f43f5e" stroke-width="3" />
    <line x1="274" y1="365" x2="316" y2="362" stroke="#f43f5e" stroke-width="3" />
    <line x1="278" y1="430" x2="308" y2="430" />
    <line x1="278" y1="448" x2="308" y2="448" />
  </g>

  <!-- Purulent Exudate Focus -->
  <ellipse cx="295" cy="350" rx="6" ry="12" fill="#fbbf24" opacity="0.85"/>
  <ellipse cx="293" cy="375" rx="5" ry="9" fill="#fef08a" opacity="0.9"/>

  <!-- Metric Measurement Overlay Annotation -->
  <g transform="translate(340, 220)">
    <rect width="230" height="90" rx="8" fill="#1e1b4b" opacity="0.92"/>
    <text x="14" y="24" fill="#f87171" font-family="Arial, sans-serif" font-size="12" font-weight="bold">AI VISION DETECTION</text>
    <text x="14" y="46" fill="#ffffff" font-family="Arial, sans-serif" font-size="11">Erythema Margin: 28mm</text>
    <text x="14" y="64" fill="#fbbf24" font-family="Arial, sans-serif" font-size="11">Exudate: Purulent (89%)</text>
    <text x="14" y="80" fill="#f87171" font-family="Arial, sans-serif" font-size="11">Dehiscence: 2.1mm</text>
  </g>

  <!-- Status Warning Badge -->
  <g transform="translate(30, 30)">
    <rect width="220" height="34" rx="6" fill="#b91c1c" opacity="0.95"/>
    <text x="12" y="22" fill="#fef2f2" font-family="Arial, sans-serif" font-size="12" font-weight="bold">DAY 4: EXPANDING ERYTHEMA</text>
  </g>
</svg>
